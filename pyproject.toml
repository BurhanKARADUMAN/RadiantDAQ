[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radiantdaq-research"
version = "0.1.0"
description = "Synthetic scintillator/SiPM signal-chain and PET-coincidence research prototype"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Burhan Karaduman"}]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
radiantdaq = "radiantdaq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
