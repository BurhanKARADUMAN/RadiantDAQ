name: Phase 1.2 validated data and source checks
on:
  push:
    paths:
      - 'research/phase1_2/**'
      - '.github/workflows/phase1-2-validated.yml'
  pull_request:
    paths:
      - 'research/phase1_2/**'
      - '.github/workflows/phase1-2-validated.yml'
permissions:
  contents: read
jobs:
  analysis-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python study requirements
        run: python -m pip install -r research/phase1_2/code/requirements.txt
      - name: Independent published data audit
        run: python research/phase1_2/audit_release.py
      - name: Unit tests (no Geant4 required)
        run: python -m pytest -q research/phase1_2/code/tests
