name: Phase 1.1 raw-audit software tests
on:
  push:
    branches: ["research/phase1-raw-audit-2026", main]
    paths:
      - "results/gate9-lso-bgo-511kev-phase1-1-raw-audit-2026/**"
      - ".github/workflows/phase1-1-audit-tests.yml"
  pull_request:
    paths:
      - "results/gate9-lso-bgo-511kev-phase1-1-raw-audit-2026/**"
      - ".github/workflows/phase1-1-audit-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  software-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: results/gate9-lso-bgo-511kev-phase1-1-raw-audit-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run Phase 1.1 unit tests (not GATE tests)
        run: python -m pytest -q tests/test_raw_audit.py
