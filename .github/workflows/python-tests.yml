name: Python model tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10','3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Run tests
        run: python -m pytest -q
      - name: Test command-line example
        run: |
          radiantdaq demo --events 80 --seed 900 --out outputs/check
          radiantdaq sweep --events 80 --seed 900 --out outputs/check
          test -f outputs/check/summary.json
          test -f outputs/check/04_parameter_sensitivity.png
